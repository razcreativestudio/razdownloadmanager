# ==============================================================================
# WORKFLOW: RAZ Deploy Website to IDwebhost
# Deskripsi: Otomatisasi sinkronisasi/upload folder `website/` ke server IDwebhost
#            menggunakan protokol FTP/FTPS aman via GitHub Actions.
# Pengembang: RAZ Creative Studio
# ==============================================================================

name: RAZ Deploy Website to IDwebhost

# Jalankan workflow setiap kali ada push ke branch main yang mengubah isi folder website/,
# atau jalankan secara manual melalui tombol "Run workflow" di GitHub Actions.
on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/RAZDeployWebsite.yml"
  workflow_dispatch:

# Batalkan proses deployment lama yang masih berjalan jika ada push baru (hemat resource)
concurrency:
  group: idwebhost-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Sinkronisasi Folder Website ke IDwebhost
    runs-on: ubuntu-latest

    steps:
      # Langkah 1: Ambil kode sumber dari repositori GitHub
      - name: 🚚 Checkout Kode Sumber
        uses: actions/checkout@v4
        with:
          # Ambil minimal 2 riwayat commit agar aksi dapat membandingkan perubahan berkas (incremental sync)
          fetch-depth: 2

      # Langkah 2: Sinkronisasi berkas folder website/ ke server IDwebhost via FTP/FTPS
      - name: 🌐 Unggah Berkas Website ke Hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Alamat server host FTP IDwebhost (contoh: ftp.domain-lo.com atau IP server cPanel)
          server: ${{ secrets.IDWEBHOST_FTP_SERVER }}
          # Nama pengguna akun FTP atau akun cPanel IDwebhost
          username: ${{ secrets.IDWEBHOST_FTP_USERNAME }}
          # Kata sandi akun FTP
          password: ${{ secrets.IDWEBHOST_FTP_PASSWORD }}
          # Folder sumber lokal di dalam repo yang akan diunggah
          local-dir: ./website/
          # Folder tujuan di hosting (default: public_html/ atau subfolder subdomain seperti public_html/dm/)
          server-dir: ${{ secrets.IDWEBHOST_REMOTE_DIR || 'public_html/' }}
          # Protokol koneksi (default: ftps untuk koneksi terenkripsi SSL/TLS)
          protocol: ftps
          # Port FTP (default standar 21)
          port: ${{ secrets.IDWEBHOST_FTP_PORT || 21 }}
          # Berkas atau pola yang dikecualikan dari proses upload
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
