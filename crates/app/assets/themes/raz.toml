# ==============================================================================
# RAZ Studio — RAZ Creative Studio Signature Theme
# Terakhir Diperbarui: 2026-11-11
# Deskripsi: Tema default resmi RAZ Download Manager dengan palet warna khas
#            RAZ Creative Studio: Obsidian Black, Luxury Gold (#FFD700),
#            dan aksen modern presisi.
# ==============================================================================

name = "RAZ Studio"
icons = "color"
icon-set = "metro"

[controls]
field-focus = "border"
check = "fluent"
progress = "line"
scroll = "overlay"
caption = "system"
focus = "ring"
button = "fluent"

[sizes]
radius = 6
"radius.part" = 4
"radius.check" = 4
"radius.flyout" = 8
"radius.menu-item" = 4
"radius.popup" = 6
"radius.egui" = 6

[seeds.dark]
background = "#12151b"
surface = "#191d24"
header = "#15181f"
text = "#f3f5f8"
accent = "#ffd700"
selection = "#ffd70033"
error = "#ff6b6b"
warning = "#ffd166"
success = "#06d6a0"

[seeds.light]
background = "#f6f8fa"
surface = "#ffffff"
header = "#f1f3f6"
text = "#161b22"
accent = "#c99700"
selection = "#fff4cc"
error = "#d73a49"
warning = "#b08800"
success = "#28a745"

[dark]
window = "#12151b"
list = "#15181f"
"list.grid" = "#1d222b"
field = "#191d24"
"field.border" = "#2c3340"
"field.bottom" = "#ffd700aa"

# Header & Menubar
menubar = "#14171e"
"menubar.bottom" = "#14171e"
"menubar.line" = "#222733"
header = "#181c25"
"header.line" = "#242a37"
"header.sep" = "#242a37"
"header.sorted" = "#202531"

# Button luxury styling
button = "#202530"
"button.border" = "#313849"
"button.bottom" = "#282e3c"
"button.hot" = "#29303e"
"button.pressed" = "#1c212a"
"button.text" = "#f3f5f8"
"button.default.border" = "#ffd700"
"button.default.bottom" = "#d4af37"

# Accent button (Gold with dark obsidian text)
"button.accent" = "#ffd700"
"button.accent.hot" = "#ffe033"
"button.accent.pressed" = "#e6c200"
"button.accent.bottom" = "#ccaa00"
"button.accent.text" = "#0d0f12"
"button.accent.text.pressed" = "#0d0f12"

# Links & Selection
link = "#ffd700"
selection = "#ffd70033"
"selection.text" = "#ffffff"
"selection.muted" = "#ffd700bb"
"selection.inactive" = "#252b36"
"focus.ring" = "#ffd700bf"

# Tabs
"tab.page" = "#181c24"
tab = "#14171e"
"tab.hot" = "#202530"

# Progress & Segments (Radiant Gold Energy)
"progress.bar" = "#ffd700"
"progress.track" = "#202530"
"meter.fill" = "#ffd700"
"meter.edge" = "#ffd70066"
"meter.track" = "#1c2028"

